<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miranha - O Jogo do Clique</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #222;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }

        #game-container {
            width: 80vw;
            height: 80vh;
            border: 4px solid #555;
            background-color: #111;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }

        #miranha {
            width: 90px; /* Diminuí um pouco para ficar mais difícil */
            height: auto;
            position: absolute;
            cursor: crosshair;
            transition: all 0.15s ease-out; /* Movimento mais brusco e rápido */
            pointer-events: auto;
            z-index: 2;
        }

        #ui-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        #score-display, #time-display {
            font-weight: bold;
        }

        #start-button {
            padding: 10px 20px;
            font-size: 1.2em;
            background-color: #e23636;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #start-button:hover {
            background-color: #b32424;
        }

        /* Estilo do balão de fala */
        .balao-fala {
            position: absolute;
            background: white;
            color: black;
            padding: 4px 8px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.9em;
            pointer-events: none;
            z-index: 10;
            animation: subir 0.6s ease-out forwards;
            box-shadow: 2px 2px 0px #000;
        }

        /* Triângulo do balão de fala */
        .balao-fala::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px 5px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }

        @keyframes subir {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div>Tempo: <span id="time-display">30</span>s</div>
        <div>Pontos: <span id="score-display">0</span></div>
        <button id="start-button">Iniciar Jogo</button>
    </div>

    <div id="game-container">
        <img src="miranha.png" id="miranha" alt="Miranha" style="display:none;">
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const miranha = document.getElementById('miranha');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const startButton = document.getElementById('start-button');

        let score = 0;
        let timeLeft = 30;
        let gameInterval;
        let moveInterval;
        
        // Deixei o jogo base mais rápido! Começa em 600ms (antes era 1000ms)
        let initialSpeed = 600; 
        let currentSpeed = initialSpeed;

        function startGame() {
            score = 0;
            timeLeft = 30;
            currentSpeed = initialSpeed;
            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            startButton.style.display = 'none';
            miranha.style.display = 'block';

            clearInterval(gameInterval);
            clearInterval(moveInterval);

            gameInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            moveMiranha();
            moveInterval = setInterval(moveMiranha, currentSpeed);
        }

        function moveMiranha() {
            const containerWidth = gameContainer.clientWidth;
            const containerHeight = gameContainer.clientHeight;
            const miranhaWidth = miranha.clientWidth || 90;
            const miranhaHeight = miranha.clientHeight || 90;

            const randomX = Math.floor(Math.random() * (containerWidth - miranhaWidth));
            const randomY = Math.floor(Math.random() * (containerHeight - miranhaHeight));

            miranha.style.left = `${randomX}px`;
            miranha.style.top = `${randomY}px`;
        }

        function falarAgilidade() {
            // Cria o balão de fala visual
            const balao = document.createElement('div');
            balao.textContent = "Agilidade!";
            balao.className = 'balao-fala';
            balao.style.left = `${miranha.offsetLeft + 10}px`;
            balao.style.top = `${miranha.offsetTop - 20}px`;
            gameContainer.appendChild(balao);

            // Remove o balão depois da animação
            setTimeout(() => balao.remove(), 600);

            // Usa a voz do navegador para falar (se suportado)
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Cancela falas anteriores para não encavalar
                const fala = new SpeechSynthesisUtterance('Agilidade!');
                fala.lang = 'pt-BR';
                fala.rate = 1.6; // Fala rapidinho
                fala.pitch = 1.2; // Voz um pouco mais aguda/animada
                window.speechSynthesis.speak(fala);
            }
        }

        miranha.addEventListener('click', () => {
            if (timeLeft > 0) {
                score++;
                scoreDisplay.textContent = score;

                // Chama a função da fala e do balão
                falarAgilidade();

                miranha.style.opacity = '0.5';
                setTimeout(() => miranha.style.opacity = '1', 100);

                // Fica BEM mais rápido a cada clique (cai de 40 em 40ms, mínimo de 150ms)
                currentSpeed = Math.max(150, currentSpeed - 40); 
                clearInterval(moveInterval);
                moveInterval = setInterval(moveMiranha, currentSpeed);

                moveMiranha();
            }
        });

        function endGame() {
            clearInterval(gameInterval);
            clearInterval(moveInterval);
            miranha.style.display = 'none';
            startButton.style.display = 'block';
            startButton.textContent = 'Jogar Novamente';
            alert(`Fim de jogo! O Miranha foi pego ${score} vezes.`);
        }

        startButton.addEventListener('click', startGame);

    </script>
</body>
</html>
