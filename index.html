<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miranha - O Jogo do Clique</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #222;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }

        #game-container {
            width: 80vw;
            height: 80vh;
            border: 4px solid #555;
            background-color: #3b3a36; /* Cor um pouco mais clara para destacar os troncos */
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }

        #miranha {
            width: 90px;
            height: auto;
            position: absolute;
            cursor: crosshair;
            transition: all 0.15s ease-out;
            pointer-events: auto;
            z-index: 2; /* Fica atrás dos troncos! */
        }

        /* Estilo dos tronquinhos */
        .tronco {
            width: 85px;
            height: auto;
            position: absolute;
            z-index: 3; /* Fica na frente do Miranha, servindo de escudo */
            pointer-events: auto;
            cursor: not-allowed;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5));
        }

        #ui-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        #score-display, #time-display {
            font-weight: bold;
        }

        #start-button {
            padding: 10px 20px;
            font-size: 1.2em;
            background-color: #e23636;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #start-button:hover {
            background-color: #b32424;
        }

        .balao-fala {
            position: absolute;
            background: white;
            color: black;
            padding: 4px 8px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.9em;
            pointer-events: none;
            z-index: 10;
            animation: subir 0.6s ease-out forwards;
            box-shadow: 2px 2px 0px #000;
        }

        .balao-fala::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px 5px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }

        @keyframes subir {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }
        
        .balao-erro {
            color: red;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div>Tempo: <span id="time-display">30</span>s</div>
        <div>Pontos: <span id="score-display">0</span></div>
        <button id="start-button">Iniciar Jogo</button>
    </div>

    <div id="game-container">
        <img src="miranha.png" id="miranha" alt="Miranha" style="display:none;">
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const miranha = document.getElementById('miranha');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const startButton = document.getElementById('start-button');

        let score = 0;
        let timeLeft = 30;
        let gameInterval;
        let moveInterval;
        let initialSpeed = 600; 
        let currentSpeed = initialSpeed;
        const quantidadeTroncos = 6; // Quantidade de troncos na tela
        
        let vozes = [];

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                vozes = window.speechSynthesis.getVoices();
            };
        }

        function espalharTroncos() {
            // Remove troncos antigos se houver
            document.querySelectorAll('.tronco').forEach(t => t.remove());

            const containerWidth = gameContainer.clientWidth;
            const containerHeight = gameContainer.clientHeight;
            const troncoSize = 85;

            for (let i = 0; i < quantidadeTroncos; i++) {
                const tronco = document.createElement('img');
                tronco.src = 'tronquinho.png';
                tronco.className = 'tronco';
                
                const randomX = Math.floor(Math.random() * (containerWidth - troncoSize));
                const randomY = Math.floor(Math.random() * (containerHeight - troncoSize));
                
                tronco.style.left = `${randomX}px`;
                tronco.style.top = `${randomY}px`;

                // Punição ao clicar no tronco
                tronco.addEventListener('click', (e) => {
                    if (timeLeft > 0) {
                        score = Math.max(0, score - 1); // Não deixa a pontuação ficar negativa
                        scoreDisplay.textContent = score;
                        mostrarTexto("-1 Ponto!", e.clientX, e.clientY, true);
                    }
                });

                gameContainer.appendChild(tronco);
            }
        }

        function startGame() {
            if ('speechSynthesis' in window) {
                const somMudo = new SpeechSynthesisUtterance('');
                somMudo.volume = 0;
                window.speechSynthesis.speak(somMudo);
            }

            score = 0;
            timeLeft = 30;
            currentSpeed = initialSpeed;
            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            startButton.style.display = 'none';
            miranha.style.display = 'block';

            espalharTroncos(); // Cria os troncos quando o jogo começa

            clearInterval(gameInterval);
            clearInterval(moveInterval);

            gameInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            moveMiranha();
            moveInterval = setInterval(moveMiranha, currentSpeed);
        }

        function moveMiranha() {
            const containerWidth = gameContainer.clientWidth;
            const containerHeight = gameContainer.clientHeight;
            const miranhaWidth = miranha.clientWidth || 90;
            const miranhaHeight = miranha.clientHeight || 90;

            const randomX = Math.floor(Math.random() * (containerWidth - miranhaWidth));
            const randomY = Math.floor(Math.random() * (containerHeight - miranhaHeight));

            miranha.style.left = `${randomX}px`;
            miranha.style.top = `${randomY}px`;
        }

        function mostrarTexto(texto, posX, posY, isErro = false) {
            const balao = document.createElement('div');
            balao.textContent = texto;
            balao.className = 'balao-fala';
            if (isErro) balao.classList.add('balao-erro');
            
            // Ajusta a posição para o texto flutuar onde o clique aconteceu
            const rect = gameContainer.getBoundingClientRect();
            balao.style.left = `${posX - rect.left}px`;
            balao.style.top = `${posY - rect.top - 20}px`;
            
            gameContainer.appendChild(balao);
            setTimeout(() => balao.remove(), 600);
        }

        function falarAgilidade() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const fala = new SpeechSynthesisUtterance('Agilidade!');
                fala.lang = 'pt-BR';
                fala.rate = 1.6; 
                fala.pitch = 1.2; 
                fala.volume = 1;

                if (vozes.length > 0) {
                    const vozPt = vozes.find(v => v.lang === 'pt-BR' || v.lang === 'pt_BR');
                    if (vozPt) {
                        fala.voice = vozPt;
                    }
                }
                window.speechSynthesis.speak(fala);
            }
        }

        miranha.addEventListener('click', (e) => {
            if (timeLeft > 0) {
                score++;
                scoreDisplay.textContent = score;

                falarAgilidade();
                mostrarTexto("Agilidade!", e.clientX, e.clientY);

                miranha.style.opacity = '0.5';
                setTimeout(() => miranha.style.opacity = '1', 100);

                currentSpeed = Math.max(150, currentSpeed - 40); 
                clearInterval(moveInterval);
                moveInterval = setInterval(moveMiranha, currentSpeed);

                moveMiranha();
            }
        });

        function endGame() {
            clearInterval(gameInterval);
            clearInterval(moveInterval);
            miranha.style.display = 'none';
            document.querySelectorAll('.tronco').forEach(t => t.style.display = 'none');
            startButton.style.display = 'block';
            startButton.textContent = 'Jogar Novamente';
            alert(`Fim de jogo! O Miranha foi pego ${score} vezes.`);
        }

        startButton.addEventListener('click', startGame);

    </script>
</body>
</html>
