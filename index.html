<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miranha - O Jogo do Clique</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation; /* Evita zoom em double tap */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #222;
            color: white;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Melhor para mobile */
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #ui-container {
            display: flex;
            flex-wrap: wrap; /* Permite quebrar linha em telas muito finas */
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 15px;
            padding: 10px;
            font-size: clamp(1.2em, 4vw, 1.5em); /* Fonte responsiva */
        }

        #stats {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        #score-display, #time-display {
            font-weight: bold;
        }

        #start-button {
            padding: 12px 24px;
            font-size: clamp(1em, 3.5vw, 1.2em);
            background-color: #e23636;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        #start-button:active {
            background-color: #b32424;
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.3);
        }

        #game-container {
            width: 100%;
            max-width: 600px;
            flex-grow: 1; /* Ocupa o resto do espaço disponível */
            max-height: 75vh;
            border: 3px solid #555;
            background-color: #3b3a36;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        #miranha {
            width: clamp(60px, 15vw, 90px); /* Tamanho responsivo */
            height: auto;
            position: absolute;
            cursor: crosshair;
            transition: all 0.1s linear; /* Movimento um pouco mais suave/rápido */
            pointer-events: auto;
            z-index: 2;
        }

        .tronco {
            width: clamp(65px, 16vw, 85px); /* Tamanho responsivo */
            height: auto;
            position: absolute;
            z-index: 3;
            pointer-events: auto;
            cursor: not-allowed;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5));
        }

        .balao-fala {
            position: absolute;
            background: white;
            color: black;
            padding: 4px 8px;
            border-radius: 10px;
            font-weight: bold;
            font-size: clamp(0.8em, 3vw, 1em);
            pointer-events: none;
            z-index: 10;
            animation: subir 0.6s ease-out forwards;
            box-shadow: 2px 2px 0px #000;
            white-space: nowrap;
        }

        .balao-fala::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px 5px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }

        @keyframes subir {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }
        
        .balao-erro {
            color: #d32f2f;
            background: #ffebee;
        }
        .balao-erro::after {
            border-color: #ffebee transparent transparent transparent;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div id="stats">
            <div>Tempo: <span id="time-display">30</span>s</div>
            <div>Pontos: <span id="score-display">0</span></div>
        </div>
        <button id="start-button">Iniciar Jogo</button>
    </div>

    <div id="game-container">
        <img src="miranha.png" id="miranha" alt="Miranha" style="display:none;" draggable="false">
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const miranha = document.getElementById('miranha');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const startButton = document.getElementById('start-button');

        let score = 0;
        let timeLeft = 30;
        let gameInterval;
        let moveInterval;
        let initialSpeed = 700; // Pouco mais lento no início para mobile
        let currentSpeed = initialSpeed;
        let resizeTimeout; // FIX: para debounce do resize
        
        // Ajusta a quantidade de troncos dependendo do tamanho da tela
        const getQuantidadeTroncos = () => window.innerWidth < 600 ? 4 : 6; 
        
        let vozes = [];

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                vozes = window.speechSynthesis.getVoices();
            };
        }

        function espalharTroncos() {
            document.querySelectorAll('.tronco').forEach(t => t.remove());

            const containerWidth = gameContainer.clientWidth;
            const containerHeight = gameContainer.clientHeight;
            
            // Pega o tamanho real que o tronco vai ter na tela
            const dummyTronco = document.createElement('img');
            dummyTronco.src = 'tronquinho.png'; // FIX: sem src, clientHeight ficava 0 (height:auto não tinha como calcular)
            dummyTronco.className = 'tronco';
            dummyTronco.style.visibility = 'hidden';
            gameContainer.appendChild(dummyTronco);
            const troncoWidth = dummyTronco.clientWidth || 70;
            const troncoHeight = dummyTronco.clientHeight || 70;
            dummyTronco.remove();

            const qtd = getQuantidadeTroncos();

            for (let i = 0; i < qtd; i++) {
                const tronco = document.createElement('img');
                tronco.src = 'tronquinho.png';
                tronco.className = 'tronco';
                tronco.draggable = false; // Previne arrastar imagem no mobile
                
                // Garante que fique dentro dos limites
                const maxX = Math.max(0, containerWidth - troncoWidth);
                const maxY = Math.max(0, containerHeight - troncoHeight);
                
                const randomX = Math.floor(Math.random() * maxX);
                const randomY = Math.floor(Math.random() * maxY);
                
                tronco.style.left = `${randomX}px`;
                tronco.style.top = `${randomY}px`;

                // Usamos 'pointerdown' para ser mais responsivo no toque
                tronco.addEventListener('pointerdown', (e) => {
                    if (timeLeft > 0) {
                        score = Math.max(0, score - 1);
                        scoreDisplay.textContent = score;
                        mostrarTexto("-1 Ponto!", e.clientX, e.clientY, true);
                    }
                });

                gameContainer.appendChild(tronco);
            }
        }

        function startGame() {
            if ('speechSynthesis' in window) {
                const somMudo = new SpeechSynthesisUtterance('');
                somMudo.volume = 0;
                window.speechSynthesis.speak(somMudo);
            }

            score = 0;
            timeLeft = 30;
            currentSpeed = initialSpeed;
            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            startButton.style.display = 'none';
            miranha.style.display = 'block';

            espalharTroncos();

            clearInterval(gameInterval);
            clearInterval(moveInterval);

            gameInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            moveMiranha();
            moveInterval = setInterval(moveMiranha, currentSpeed);
        }

        function moveMiranha() {
            const containerWidth = gameContainer.clientWidth;
            const containerHeight = gameContainer.clientHeight;
            const miranhaWidth = miranha.clientWidth || 70;
            const miranhaHeight = miranha.clientHeight || 70;

            const maxX = Math.max(0, containerWidth - miranhaWidth);
            const maxY = Math.max(0, containerHeight - miranhaHeight);

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            miranha.style.left = `${randomX}px`;
            miranha.style.top = `${randomY}px`;
        }

        function mostrarTexto(texto, posX, posY, isErro = false) {
            const balao = document.createElement('div');
            balao.textContent = texto;
            balao.className = 'balao-fala';
            if (isErro) balao.classList.add('balao-erro');
            
            const rect = gameContainer.getBoundingClientRect();
            
            // Tenta manter o balão dentro da tela
            let finalX = posX - rect.left;
            if (finalX < 20) finalX = 20;
            if (finalX > rect.width - 60) finalX = rect.width - 60;

            balao.style.left = `${finalX}px`;
            balao.style.top = `${posY - rect.top - 30}px`;
            
            gameContainer.appendChild(balao);
            setTimeout(() => balao.remove(), 600);
        }

        function falarAgilidade() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const fala = new SpeechSynthesisUtterance('Agilidade!');
                fala.lang = 'pt-BR';
                fala.rate = 1.6; 
                fala.pitch = 1.2; 
                fala.volume = 1;

                if (vozes.length > 0) {
                    const vozPt = vozes.find(v => v.lang === 'pt-BR' || v.lang === 'pt_BR');
                    if (vozPt) {
                        fala.voice = vozPt;
                    }
                }
                window.speechSynthesis.speak(fala);
            }
        }

        // 'pointerdown' reage mais rápido que 'click' em telas touch
        miranha.addEventListener('pointerdown', (e) => {
            if (timeLeft > 0) {
                score++;
                scoreDisplay.textContent = score;

                falarAgilidade();
                mostrarTexto("Agilidade!", e.clientX, e.clientY);

                miranha.style.opacity = '0.5';
                setTimeout(() => miranha.style.opacity = '1', 100);

                currentSpeed = Math.max(250, currentSpeed - 30); // Limite um pouco maior para mobile
                clearInterval(moveInterval);
                moveInterval = setInterval(moveMiranha, currentSpeed);

                moveMiranha();
            }
        });

        function endGame() {
            clearInterval(gameInterval);
            clearInterval(moveInterval);
            miranha.style.display = 'none';
            document.querySelectorAll('.tronco').forEach(t => t.style.display = 'none');
            startButton.style.display = 'block';
            startButton.textContent = 'Jogar Novamente';
            // Pequeno delay para evitar que o clique duplo no final feche o alert rápido demais
            setTimeout(() => {
                alert(`Fim de jogo! O Miranha foi pego ${score} vezes.`);
            }, 100);
            
        }

        startButton.addEventListener('click', startGame);

        // Recalcula limites se girar a tela (FIX: agora com debounce para não disparar em excesso durante o resize)
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (startButton.style.display === 'none') {
                    espalharTroncos(); // Re-espalha troncos pra adaptar ao novo tamanho
                    moveMiranha();
                }
            }, 150);
        });

    </script>
</body>
</html>
